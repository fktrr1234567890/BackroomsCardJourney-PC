name: Bootstrap Import

on:
  push:
    paths:
      - '.github/workflows/bootstrap-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载源码包
        run: |
          curl -sSL -o src.zip "https://aka.doubaocdn.com/s/FVRHNZfxd4"
          ls -l src.zip
          unzip -oq src.zip -d _src
          ls -a _src

      - name: 同步到仓库
        run: |
          rsync -a _src/ ./
          rm -rf _src src.zip

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要提交的改动"
          else
            git commit -m "导入 Windows 桌面版源码 v0.0.5"
            git push
          fi
